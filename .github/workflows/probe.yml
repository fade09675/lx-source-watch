name: 音源探测

# 由 Cloudflare Worker 的 Cron Trigger（每 5 分钟检查）在到点时触发本工作流。
# GitHub 自己的 schedule 在新仓库上不可靠，这里不再配置，避免重复运行。
# 6 次/天 × 约 90 秒，公开仓库不计费。
on:
  workflow_dispatch:
    inputs:
      only:
        description: "只测指定来源 id，逗号分隔（留空=全部）"
        required: false
        type: string
      limit:
        description: "最多测几个来源（留空=全部）"
        required: false
        type: string
      deep:
        description: "从脚本声明的最高音质开始测试"
        required: false
        type: boolean
        default: false
      prefer_mirror:
        description: "优先用 ghproxy 镜像下载脚本"
        required: false
        type: boolean
        default: false
      proxy_id:
        description: "国内补测强制使用指定代理节点 id（留空=自动挑）"
        required: false
        type: string
      concurrency:
        description: "同时测几个来源"
        required: false
        type: string
        default: "4"
      cn:
        description: "本轮是否做国内补测"
        required: false
        type: boolean
        default: true
      discover:
        description: "本轮是否顺带自动发现候选"
        required: false
        type: boolean
        default: false
      task_id:
        description: "任务系统：关联任务 id（由 Worker 传入）"
        required: false
        type: string
      run_id:
        description: "任务系统：预分配的运行 id（由 Worker 传入）"
        required: false
        type: string
      trigger:
        description: "任务系统：触发方式 schedule/manual/retry/local"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: lx-probe
  cancel-in-progress: false

jobs:
  # 第一个平面：执行第三方脚本、拉流。此 job 不能接触任何密钥。
  probe:
    name: 探测（无密钥）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # 音源清单由网页管理，探测任务从这里读取；读不到会自动回退仓库内清单。
      LX_REGISTRY_URL: https://dash.dpdns.org/api/config/sources
      # 网页添加的发现仓库；读不到时只用仓库内置仓库。
      LX_DISCOVERY_URL: https://dash.dpdns.org/api/config/discovery
    steps:
      - name: 检出
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm typecheck

      - name: 单元测试
        run: pnpm test

      - name: 自动发现候选
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.discover }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pnpm discover -- --config sources/discovery.json --out out/candidates.json --token "$GITHUB_TOKEN"
          pnpm candidates -- --in out/candidates.json --out out/candidates.json --limit 30

      - name: 探测
        env:
          INPUT_ONLY: ${{ inputs.only }}
          INPUT_LIMIT: ${{ inputs.limit }}
          INPUT_DEEP: ${{ inputs.deep }}
          INPUT_PREFER_MIRROR: ${{ inputs.prefer_mirror }}
          INPUT_CONCURRENCY: ${{ inputs.concurrency }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p out
          args=(--concurrency "${INPUT_CONCURRENCY:-4}")
          if [ -n "${RUN_ID}" ]; then args+=(--run-id "${RUN_ID}"); fi
          if [ -n "${INPUT_ONLY}" ]; then args+=(--only "${INPUT_ONLY}"); fi
          if [ -n "${INPUT_LIMIT}" ]; then args+=(--limit "${INPUT_LIMIT}"); fi
          if [ "${INPUT_DEEP}" = "true" ]; then args+=(--deep); fi
          if [ "${INPUT_PREFER_MIRROR}" = "true" ]; then args+=(--prefer-mirror); fi
          pnpm probe -- "${args[@]}" 2>&1 | tee out/run.log

      - name: 校验产物
        run: pnpm validate

      - name: 上传探测结果
        uses: actions/upload-artifact@v4
        with:
          name: probe-result
          path: |
            out/status.json
            out/urls.json
            out/run.log
          retention-days: 7
          if-no-files-found: error

      - name: 上传候选结果
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.discover }}
        uses: actions/upload-artifact@v4
        with:
          name: candidates-result
          path: out/candidates.json
          retention-days: 7
          if-no-files-found: ignore

  # 第二个平面：只测已解析 URL，不执行任何音源脚本；持有代理池 token。
  cn:
    name: 国内补测（不执行脚本）
    needs: probe
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.cn }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    env:
      INGEST_URL: ${{ secrets.INGEST_URL }}
      RUNNER_TOKEN: ${{ secrets.RUNNER_TOKEN }}
      PROXY_ID: ${{ inputs.proxy_id }}
    steps:
      - name: 检出
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 下载探测结果
        uses: actions/download-artifact@v4
        with:
          name: probe-result
          path: out

      - name: 缓存 mihomo 内核
        uses: actions/cache@v4
        with:
          path: .tmp/mihomo
          key: mihomo-v1.19.9

      - name: 国内补测
        if: env.RUNNER_TOKEN != ''
        run: |
          set -euo pipefail
          mkdir -p out
          args=(--urls-in out/urls.json --out out/cn.json --endpoint "$INGEST_URL" --token "$RUNNER_TOKEN" --max-proxies 8 --concurrency 5)
          if [ -n "$PROXY_ID" ]; then args+=(--proxy-id "$PROXY_ID"); fi
          pnpm cn -- "${args[@]}" 2>&1 | tee out/cn.log

      - name: 未配置代理池
        if: env.RUNNER_TOKEN == ''
        run: echo "未配置 RUNNER_TOKEN，跳过国内补测。"

      - name: 上传国内补测结果
        uses: actions/upload-artifact@v4
        with:
          name: cn-result
          path: |
            out/cn.json
            out/cn.log
          retention-days: 7
          if-no-files-found: ignore

  # 第三个平面：只读 JSON 并签名上报，绝不执行音源代码。
  publish:
    name: 上报（持密钥，不执行脚本）
    needs: [probe, cn]
    if: ${{ !cancelled() && needs.probe.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      INGEST_URL: ${{ secrets.INGEST_URL }}
      INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
    steps:
      - name: 检出
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 下载探测结果
        uses: actions/download-artifact@v4
        with:
          name: probe-result
          path: out

      - name: 下载国内补测结果
        uses: actions/download-artifact@v4
        with:
          name: cn-result
          path: out
        continue-on-error: true

      - name: 下载候选结果
        uses: actions/download-artifact@v4
        with:
          name: candidates-result
          path: out
        continue-on-error: true

      - name: 合并运行日志
        run: |
          set -euo pipefail
          touch out/run.log
          if [ -f out/cn.log ]; then
            printf '\n===== 国内补测 =====\n' >> out/run.log
            cat out/cn.log >> out/run.log
          fi

      - name: 上报
        if: env.INGEST_URL != ''
        env:
          TASK_ID: ${{ inputs.task_id }}
          TRIGGER: ${{ inputs.trigger }}
        run: >-
          pnpm ingest --
          --snapshot out/status.json
          --cn out/cn.json
          --candidates out/candidates.json
          --log out/run.log
          --task-id "$TASK_ID"
          --trigger "${TRIGGER:-manual}"
          --endpoint "$INGEST_URL"
          --secret "$INGEST_SECRET"

      - name: 未配置上报地址
        if: env.INGEST_URL == ''
        run: |
          echo "未配置 INGEST_URL，跳过上报。"
          echo "P3 部署 Worker 后，在仓库 Secrets 里添加 INGEST_URL 与 INGEST_SECRET 即可自动生效。"
